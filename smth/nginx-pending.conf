# ICP approved. HTTPS certificate and renewal are managed by Certbot.
server {
    listen 80;
    server_name apps.qteqpid.xyz;
    root /var/www/qteqpid-apps;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://apps.qteqpid.xyz$request_uri; }
}

server {
    listen 443 ssl;
    server_name apps.qteqpid.xyz;
    root /var/www/qteqpid-apps;
    index index.html;
    autoindex off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    location /assets/ {
        alias /var/www/smth/assets/;
        expires 1d;
    }
    location /downloads/ { alias /var/www/smth/downloads/; }
    location = /smth { return 301 https://smth.qteqpid.xyz/; }
    location /smth/ { return 301 https://smth.qteqpid.xyz/; }
    location ~ /\. { deny all; }
    location ~ \.conf$ { deny all; }
    ssl_certificate /etc/letsencrypt/live/apps.qteqpid.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.qteqpid.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl;
    server_name qteqpid.xyz;
    root /var/www/qteqpid-apps;
    index index.html;
    autoindex off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    location /assets/ {
        alias /var/www/smth/assets/;
        expires 1d;
    }
    location /downloads/ { alias /var/www/smth/downloads/; }
    location = /smth { return 301 https://smth.qteqpid.xyz/; }
    location /smth/ { return 301 https://smth.qteqpid.xyz/; }
    location ~ /\. { deny all; }
    location ~ \.conf$ { deny all; }
    ssl_certificate /etc/letsencrypt/live/qteqpid.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qteqpid.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen 127.0.0.1:8080;
    server_name qteqpid.xyz;
    root /var/www/smth;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://qteqpid.xyz$request_uri; }
}

server {
    listen 443 ssl;
    server_name smth.qteqpid.xyz;
    root /var/www/smth;
    index index.html;
    autoindex off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    ssl_certificate /etc/letsencrypt/live/smth.qteqpid.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smth.qteqpid.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { try_files $uri $uri/ =404; }
    location = /events {
        proxy_pass https://telemetry.qteqpid.xyz;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host telemetry.qteqpid.xyz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }
    location ~ /\. { deny all; }
    location ~ \.conf$ { deny all; }
}

server {
    listen 80;
    server_name smth.qteqpid.xyz;
    root /var/www/smth;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://smth.qteqpid.xyz$request_uri; }
}
