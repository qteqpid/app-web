<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Code Hash Tools</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #07090d;
            --surface: #0d121b;
            --surface-strong: #111a24;
            --surface-muted: #101b23;
            --ink: #f5f7fb;
            --ink-muted: #a2adbd;
            --line: rgba(116, 227, 220, 0.18);
            --line-strong: rgba(116, 227, 220, 0.46);
            --accent: #74e3dc;
            --accent-soft: rgba(116, 227, 220, 0.12);
            --danger: #ff6f7d;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100dvh;
            margin: 0;
            font-family: 'Avenir Next', 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background:
                linear-gradient(90deg, rgba(116, 227, 220, 0.025) 1px, transparent 1px),
                linear-gradient(0deg, rgba(116, 227, 220, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 78% 10%, rgba(116, 227, 220, 0.14), transparent 34%),
                var(--page);
            background-size: 54px 54px, 54px 54px, auto, auto;
            color: var(--ink);
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .container {
            width: min(1080px, calc(100% - 32px));
            margin: 38px auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            align-items: flex-end;
            margin-bottom: 22px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 0.86rem;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.1rem, 5vw, 4.2rem);
            line-height: 1;
            letter-spacing: 0;
        }

        .description {
            max-width: 720px;
            margin: 14px 0 0;
            color: var(--ink-muted);
            font-size: 1.02rem;
            line-height: 1.7;
        }

        .home-link {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 18px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--ink);
            text-decoration: none;
            font-weight: 800;
        }

        .home-link:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .tool-layout {
            display: grid;
            grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
            gap: 18px;
            align-items: start;
        }

        .panel {
            border-top: 1px solid var(--line);
            background: rgba(13, 18, 27, 0.96);
            box-shadow: 0 26px 80px rgba(0, 0, 0, 0.22);
        }

        .panel-inner {
            padding: 22px;
        }

        .panel-title {
            margin: 0 0 16px;
            font-size: 1.14rem;
            line-height: 1.3;
        }

        .field {
            display: grid;
            gap: 8px;
            margin-bottom: 16px;
        }

        .field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        label {
            color: var(--ink);
            font-size: 0.92rem;
            font-weight: 800;
        }

        .hint {
            color: var(--ink-muted);
            font-size: 0.84rem;
            line-height: 1.6;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--page);
            color: var(--ink);
            outline: none;
        }

        input {
            height: 46px;
            padding: 0 13px;
        }

        textarea {
            min-height: 190px;
            padding: 14px;
            resize: vertical;
            line-height: 1.55;
        }

        input:focus,
        textarea:focus {
            border-color: var(--line-strong);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(162, 173, 189, 0.62);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .button {
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 0 17px;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.05);
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.16s, border-color 0.16s, background 0.16s;
        }

        .button:hover {
            border-color: var(--line-strong);
            background: var(--surface-muted);
        }

        .button:active {
            transform: translateY(1px);
        }

        .button.primary {
            border-color: transparent;
            background: var(--accent);
            color: #061013;
        }

        .button.small {
            min-height: 32px;
            padding: 0 12px;
            font-size: 0.84rem;
        }

        .result-grid {
            display: grid;
            gap: 12px;
        }

        .result-card {
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface-strong);
        }

        .result-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 9px;
            color: var(--ink-muted);
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .mono {
            overflow-wrap: anywhere;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 0.94rem;
            line-height: 1.5;
        }

        .code-value {
            color: var(--accent);
            font-size: 1.28rem;
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        .notice {
            margin-top: 14px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            color: var(--ink-muted);
            background: rgba(116, 227, 220, 0.07);
            font-size: 0.92rem;
            line-height: 1.65;
        }

        .error {
            display: none;
            margin-top: 12px;
            color: var(--danger);
            font-weight: 800;
            line-height: 1.5;
        }

        .error.visible {
            display: block;
        }

        .copy-status {
            min-height: 22px;
            margin-top: 12px;
            color: var(--accent);
            font-size: 0.88rem;
            font-weight: 800;
        }

        @media (max-width: 820px) {
            .container {
                margin: 26px auto;
            }

            .page-header,
            .tool-layout {
                grid-template-columns: 1fr;
            }

            .page-header {
                display: grid;
                align-items: start;
            }

            .home-link {
                width: fit-content;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <div>
                <p class="eyebrow">Internal Tool</p>
                <h1>Code Hash Tool</h1>
                <p class="description">
                    输入明文 code，浏览器会生成新的随机 salt 和对应的 codeHash。
                </p>
            </div>
            <a class="home-link" href="index.html">返回首页</a>
        </header>

        <section class="tool-layout" aria-label="Code hash generator">
            <form class="panel" id="hashForm">
                <div class="panel-inner">
                    <h2 class="panel-title">输入</h2>

                    <div class="field">
                        <label for="codeInput">明文 code</label>
                        <input id="codeInput" autocomplete="off" maxlength="10" inputmode="text" placeholder="例如 Ab12X9">
                        <div class="hint">输入 1-10 位 ASCII 字母或数字。每次生成都会创建新的 16 bytes random salt。</div>
                    </div>

                    <div class="actions">
                        <button class="button primary" type="submit">生成 salt 和 codeHash</button>
                        <button class="button" type="button" id="clearButton">清空</button>
                    </div>

                    <div class="error" id="errorMessage" role="alert"></div>
                </div>
            </form>

            <section class="panel" aria-label="Generated result">
                <div class="panel-inner">
                    <h2 class="panel-title">结果</h2>

                    <div class="result-grid">
                        <div class="result-card">
                            <div class="result-label">
                                Plain code
                                <button class="button small" type="button" data-copy-target="plainCode">复制</button>
                            </div>
                            <div class="mono code-value" id="plainCode">-</div>
                        </div>

                        <div class="result-card">
                            <div class="result-label">
                                salt
                                <button class="button small" type="button" data-copy-target="saltValue">复制</button>
                            </div>
                            <div class="mono" id="saltValue">-</div>
                        </div>

                        <div class="result-card">
                            <div class="result-label">
                                codeHash
                                <button class="button small" type="button" data-copy-target="hashValue">复制</button>
                            </div>
                            <div class="mono" id="hashValue">-</div>
                        </div>

                        <div class="result-card">
                            <div class="result-label">
                                JSON snippet
                                <button class="button small" type="button" data-copy-target="jsonOutput">复制</button>
                            </div>
                            <textarea class="mono" id="jsonOutput" readonly spellcheck="false" placeholder="生成后这里会出现 JSON"></textarea>
                        </div>
                    </div>

                    <div class="copy-status" id="copyStatus" aria-live="polite"></div>
                </div>
            </section>
        </section>
    </main>

    <script>
        const allowedCharacters = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
        const codeInput = document.getElementById('codeInput');
        const plainCode = document.getElementById('plainCode');
        const saltValue = document.getElementById('saltValue');
        const hashValue = document.getElementById('hashValue');
        const jsonOutput = document.getElementById('jsonOutput');
        const errorMessage = document.getElementById('errorMessage');
        const copyStatus = document.getElementById('copyStatus');

        function randomBytes(length) {
            const bytes = new Uint8Array(length);
            crypto.getRandomValues(bytes);
            return bytes;
        }

        function bytesToBase64(bytes) {
            let binary = '';
            bytes.forEach(byte => {
                binary += String.fromCharCode(byte);
            });
            return btoa(binary);
        }

        function isValidCode(value) {
            return /^[0-9A-Za-z]{1,10}$/.test(value);
        }

        function setError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.toggle('visible', Boolean(message));
        }

        async function generateHash(code, saltBytes) {
            const codeBytes = new TextEncoder().encode(code);
            const payload = new Uint8Array(saltBytes.length + codeBytes.length);
            payload.set(saltBytes, 0);
            payload.set(codeBytes, saltBytes.length);
            const digest = await crypto.subtle.digest('SHA-256', payload);
            return bytesToBase64(new Uint8Array(digest));
        }

        async function updateResult(event) {
            event?.preventDefault();
            setError('');
            copyStatus.textContent = '';

            const code = codeInput.value.trim();
            if (!code) {
                setError('请输入明文 code。');
                return;
            }

            if (!isValidCode(code)) {
                setError('Code 必须是 1-10 位 ASCII 字母或数字。');
                return;
            }

            const saltBytes = randomBytes(16);
            const salt = bytesToBase64(saltBytes);
            const codeHash = await generateHash(code, saltBytes);
            const json = JSON.stringify({ codeHash, salt }, null, 2);

            plainCode.textContent = code;
            saltValue.textContent = salt;
            hashValue.textContent = codeHash;
            jsonOutput.value = json;
        }

        async function copyText(text, label) {
            if (!text || text === '-') {
                copyStatus.textContent = '还没有可复制的结果。';
                return;
            }
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
            } else {
                const helper = document.createElement('textarea');
                helper.value = text;
                helper.setAttribute('readonly', '');
                helper.style.position = 'fixed';
                helper.style.opacity = '0';
                document.body.appendChild(helper);
                helper.select();
                document.execCommand('copy');
                document.body.removeChild(helper);
            }
            copyStatus.textContent = `已复制 ${label}`;
        }

        document.getElementById('hashForm').addEventListener('submit', updateResult);

        document.getElementById('clearButton').addEventListener('click', () => {
            codeInput.value = '';
            plainCode.textContent = '-';
            saltValue.textContent = '-';
            hashValue.textContent = '-';
            jsonOutput.value = '';
            setError('');
            copyStatus.textContent = '';
        });

        document.querySelectorAll('[data-copy-target]').forEach(button => {
            button.addEventListener('click', async () => {
                const target = document.getElementById(button.dataset.copyTarget);
                const value = target instanceof HTMLTextAreaElement ? target.value : target.textContent;
                try {
                    await copyText(value.trim(), button.parentElement.firstChild.textContent.trim());
                } catch {
                    copyStatus.textContent = '复制失败，请手动选择复制。';
                }
            });
        });
    </script>
</body>
</html>
